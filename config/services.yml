services:
    uflagmey.postprune.listener:
        class: uflagmey\postprune\event\listener
        arguments:
            - '@language'
            - '@request'
            - '@config'
            - '@dbal.conn'
            - '@uflagmey.postprune.query_builder'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }

    uflagmey.postprune.topic_listener:
        class: uflagmey\postprune\event\topic_listener
        arguments:
            - '@auth'
            - '@config'
            - '@dbal.conn'
            - '@language'
            - '@log'
            - '@request'
            - '@user'
            - '%tables.topics%'
            - '%tables.forums%'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@template'
            - '@uflagmey.postprune.query_builder'
        tags:
            - { name: event.listener }

    uflagmey.postprune.query_builder:
        class: uflagmey\postprune\prune\query_builder
        arguments:
            - '%tables.posts%'
            - '%tables.topics%'
            - '%tables.forums%'

    uflagmey.postprune.pruner:
        class: uflagmey\postprune\prune\pruner
        arguments:
            - '@dbal.conn'
            - '@config'
            - '@log'
            - '@user'
            - '@uflagmey.postprune.query_builder'
            - '%core.root_path%'
            - '%core.php_ext%'

    uflagmey.postprune.cron.task.prune:
        class: uflagmey\postprune\cron\task\prune
        arguments:
            - '@config'
            - '@uflagmey.postprune.pruner'
        calls:
            - [set_name, [uflagmey.postprune.cron.task.prune]]
        tags:
            - { name: cron.task }
